name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      # Packages import each other through their published entries, which are compiled.
      - name: Build
        run: bun run build
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      # About a minute on either runner. A macOS runner once sat in this step for eleven minutes with
      # no output on code that passed before and after; a hang should fail fast and be rerun, not
      # hold the whole job until its own limit.
      - name: Test
        timeout-minutes: 5
        run: bun test --conditions browser
      - name: Pack and install check
        run: bun run pack:check
