name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write # GitHub release
  id-token: write # npm provenance and Trusted Publishing (OIDC)

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      # npm ≥ 11.5.1 publishes with provenance and supports Trusted Publishing.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          # Nothing is installed with npm here; a cache would fail to save at post-job.
          package-manager-cache: false
      - run: bun install --frozen-lockfile

      - name: Verify tag matches package versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for manifest in package.json packages/*/package.json; do
            version=$(jq -r .version "$manifest")
            if [ "$version" != "$tag" ]; then
              echo "::error file=$manifest::version $version does not match tag $tag"
              exit 1
            fi
          done

      - name: Check
        run: |
          bun run lint
          bun run typecheck
          bun test
          bun run pack:check

      - name: Publish to npm
        env:
          # Used only until each package is linked to this workflow as a Trusted Publisher on
          # npmjs.com; after that the secret can be deleted and npm authenticates via OIDC.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm --version
          mkdir -p "$RUNNER_TEMP/tarballs"
          # Dependency order; already-published versions are skipped so reruns are safe.
          for dir in protocol daemon client opencode; do
            name=$(jq -r .name "packages/$dir/package.json")
            version=$(jq -r .version "packages/$dir/package.json")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version already published"
              continue
            fi
            # bun pack rewrites workspace:* dependencies to real versions; npm publishes the tarball.
            rm -f "$RUNNER_TEMP"/tarballs/*.tgz
            (cd "packages/$dir" && bun pm pack --destination "$RUNNER_TEMP/tarballs")
            npm publish "$RUNNER_TEMP"/tarballs/*.tgz --access public --provenance
          done

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "See CHANGELOG.md" > notes.md; fi
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
