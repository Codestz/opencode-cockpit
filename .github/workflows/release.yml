name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile

      - name: Verify tag matches package versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for manifest in package.json packages/*/package.json; do
            version=$(jq -r .version "$manifest")
            if [ "$version" != "$tag" ]; then
              echo "::error file=$manifest::version $version does not match tag $tag"
              exit 1
            fi
          done

      - name: Check
        run: |
          bun run lint
          bun run typecheck
          bun test
          bun run pack:check

      - name: Publish to npm
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # Dependency order; already-published versions are skipped so reruns are safe.
          for dir in protocol daemon client opencode; do
            name=$(jq -r .name "packages/$dir/package.json")
            version=$(jq -r .version "packages/$dir/package.json")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version already published"
              continue
            fi
            (cd "packages/$dir" && bun publish --access public)
          done

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "See CHANGELOG.md" > notes.md; fi
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
