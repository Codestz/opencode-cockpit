name: Feature request
description: Suggest a capability or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Idea
      description: How you imagine it working, for the agent, the UI, or both.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
