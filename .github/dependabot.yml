version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    ignore:
      # At runtime TUI code uses the OpenTUI and Solid copies bundled inside OpenCode. Our
      # versions only provide types and must match what @opencode-ai/plugin declares; newer types
      # would let code use APIs that users' OpenCode does not have. Bump them together with
      # @opencode-ai/plugin instead.
      - dependency-name: "@opentui/*"
      - dependency-name: "solid-js"
      # Babel 8 breaks the build: babel-preset-solid 1.9 turns JSX parsing on the Babel 7 way, which
      # Babel 8 ignores (tried with 8.0.6 + preset-typescript 8.0.1 + preset-solid 1.9.15). Babel runs
      # only at build time; take its majors once the Solid preset supports them.
      - dependency-name: "@babel/*"
        update-types: ["version-update:semver-major"]
    groups:
      opencode:
        patterns: ["@opencode-ai/*"]
      tooling:
        patterns: ["typescript", "@biomejs/*", "@types/*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
